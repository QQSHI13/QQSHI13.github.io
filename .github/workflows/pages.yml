name: Deploy to GitHub Pages


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install DocsForge
        run: pip install docsforge

      - name: Build blog with DocsForge
        run: docsforge build

      # The build copies static files from docs/ into site/ (index.html,
      # projects.html, 24.html, 404.html, web-sync.html, robots.txt, ...) and
      # generates sw.js / manifest.json / sitemap.xml itself. No manual copies
      # — they would clobber DocsForge's generated output with stale files.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
