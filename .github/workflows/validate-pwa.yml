name: Validate PWA

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install DocsForge
        run: pip install docsforge

      - name: Build site
        run: docsforge build

      - name: Manifest exists
        run: test -f site/manifest.json

      - name: Service Worker exists
        run: test -f site/sw.js

      - name: Cache manifest exists
        run: test -f site/cache-manifest.json

      - name: Check manifest link in index.html
        run: grep -q '<link rel="manifest"' site/index.html

      - name: Check service worker registration in index.html
        run: grep -q 'navigator.serviceWorker.register' site/index.html || grep -q 'serviceWorker.register' site/index.html

      - name: Run Lighthouse CI
        run: lhci autorun --config=lighthouserc.js || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
